version: 2.1

jobs:
  br3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Collect the test shards ahead of round two
          command: |
            mkdir -p /tmp/d2
            set +o pipefail 2>/dev/null; { echo "## Data"; echo '```'; seq 1 1000; echo '```'; } > /tmp/d2/theta.log.7; true
            echo "wrote $(du -h /tmp/d2/theta.log.7 | awk '{print $1}') to /tmp/d2/theta.log.7"
      - persist_to_workspace:
          root: /tmp/d2
          paths:
            - 'theta.log.7'
  Rollout_Service3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/d2
      - run:
          name: Open handoff
          command: |
            b=$(wc -c < /tmp/d2/boson473 2>/dev/null || echo 0); echo "quarter = $((b / 4))"
      - run:
          name: Pull repo contents
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load vendor code
          command: tar -I gzip -xf catalog-release.tgz
      - run:
          name: Index artifacts
          command: uname -a
      - run:
          command: ./monitor-19 && true
